name: Build IELTS Master APK

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "Checking Android SDK..."

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -name sdkmanager -type f | sort -V | tail -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Create Capacitor Environment
        run: |
          npm init -y

          npm install \
            @capacitor/core@6.2.0 \
            @capacitor/cli@6.2.0 \
            @capacitor/android@6.2.0 \
            @capacitor/app@6.0.2 \
            @capacitor/local-notifications@6.1.1

      - name: Prepare Original App
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: Original index.html missing!"
            exit 1
          fi

          mkdir -p www

          cp index.html www/index.html

          echo "Original app copied successfully."

          ls -lh www/index.html

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ielts.master.skp",
            "appName": "IELTS Master",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Original App
        run: |
          npx cap sync android

      - name: Configure Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK"
          ]

          for permission in permissions:
              if permission not in s:
                  tag = (
                      f'<uses-permission '
                      f'android:name="{permission}"/>'
                  )
                  s = s.replace(
                      "<application",
                      tag + "\n    <application",
                      1
                  )

          p.write_text(s)
          print("Android permissions configured.")
          PY

      - name: Build IELTS Master APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload IELTS Master APK
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Master-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
