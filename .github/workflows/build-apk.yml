name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          npm init -y

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/app@6

          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>IELTS Master</title>
          </head>
          <body>
            <h1>IELTS Master</h1>
          </body>
          </html>
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ieltsmaster.app",
            "appName": "IELTS Master",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF

          npx cap add android

      - name: Create alarm sound
        run: |
          python3 - <<'PY'
          import wave
          import struct
          import math

          sr = 22050
          out = []

          for rep in range(8):
              for f, d in ((880,.16),(1175,.16),(880,.16),(1175,.32),(0,.2)):
                  for i in range(int(sr*d)):
                      v = 0 if f == 0 else int(
                          16000 * math.sin(2*math.pi*f*i/sr)
                      )
                      out.append(v)

          with wave.open('alarm.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(sr)
              w.writeframes(
                  b''.join(struct.pack('<h', x) for x in out)
              )
          PY

          mkdir -p android/app/src/main/res/raw
          cp alarm.wav android/app/src/main/res/raw/alarm.wav

      - name: Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK"
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}"/>'
              if permission not in s:
                  s = s.replace("<application", tag + "\n    <application", 1)

          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Master-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
