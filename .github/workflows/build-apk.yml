name: Build IELTS Master APK

# Everything needed for the APK (voice, microphone, icon, alarm sound) is created
# by this one file. The repository only needs: index.html + this workflow.

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_ROOT" || { echo "Android SDK not found"; exit 1; }
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor, Native Voice and Native Microphone
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/app@6.0.2 @capacitor/local-notifications@6.1.1 @capacitor-community/text-to-speech@4.0.2 @capacitor-community/speech-recognition@6.0.1 esbuild

      - name: Create Native Bridge (voice and microphone)
        run: |
          cat > tts-bridge.js <<'BRIDGE_EOF'
          import { TextToSpeech } from '@capacitor-community/text-to-speech';
          import { SpeechRecognition } from '@capacitor-community/speech-recognition';

          // ---- Native voice (Android Text-to-Speech) ----
          let tok = 0;
          window.IELTSNativeTTS = {
            speak: async (o) => {
              const id = ++tok;
              const base = { text: o.text, rate: o.rate ?? 0.95, pitch: o.pitch ?? 1, volume: o.volume ?? 1 };
              const langs = [o.lang || 'en-GB', 'en-US', null];
              let err;
              for (const l of langs) {
                if (id !== tok) return;
                try {
                  await TextToSpeech.speak(l ? Object.assign({ lang: l }, base) : base);
                  return;
                } catch (e) {
                  if (id !== tok) return;
                  err = e;
                }
              }
              throw err;
            },
            stop: async () => {
              tok++;
              try { await TextToSpeech.stop(); } catch (e) {}
            }
          };

          // ---- Native speech recognition (microphone -> text) ----
          let handles = [];
          const clean = async () => {
            for (const h of handles) { try { await h.remove(); } catch (e) {} }
            handles = [];
          };
          window.IELTSNativeSR = {
            ensure: async () => {
              try {
                const a = await SpeechRecognition.available();
                if (!a.available) return 'unavailable';
              } catch (e) { return 'unavailable'; }
              try {
                let p = await SpeechRecognition.checkPermissions();
                if (p.speechRecognition !== 'granted') p = await SpeechRecognition.requestPermissions();
                return p.speechRecognition === 'granted' ? 'ok' : 'denied';
              } catch (e) { return 'denied'; }
            },
            start: async (lang, onPartial, onState) => {
              try { await SpeechRecognition.stop(); } catch (e) {}
              await clean();
              handles.push(await SpeechRecognition.addListener('partialResults', (d) => {
                try { onPartial((d.matches && d.matches[0]) || ''); } catch (e) {}
              }));
              handles.push(await SpeechRecognition.addListener('listeningState', (d) => {
                try { onState(d.status); } catch (e) {}
              }));
              await new Promise((r) => setTimeout(r, 120));
              await SpeechRecognition.start({ language: lang || 'en-GB', maxResults: 1, partialResults: true, popup: false });
            },
            stop: async () => {
              try { await SpeechRecognition.stop(); } catch (e) {}
              await clean();
            }
          };
          BRIDGE_EOF

      - name: Prepare App and Bridge
        run: |
          test -f index.html || { echo "index.html missing from repository root"; exit 1; }
          mkdir -p www
          cp index.html www/index.html
          npx esbuild tts-bridge.js --bundle --format=iife --target=es2020 --outfile=www/tts-bridge.js

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ielts.master.skp",
            "appName": "IELTS Master",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": true }
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Fix Gradle Download Timeout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          lines = p.read_text().splitlines()
          out = []
          found = False
          for line in lines:
              if line.startswith("distributionUrl="):
                  line = line.replace("-all.zip", "-bin.zip")
                  found = True
              if line.startswith("networkTimeout="):
                  continue
              out.append(line)
          if not found:
              raise SystemExit("Gradle distributionUrl missing")
          out.append("networkTimeout=120000")
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Plugins
        run: npx cap sync android

      - name: Apply App Icon (new logo)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          root = Path('android/app/src/main/res')
          launcher = Image.open(BytesIO(base64.b64decode(''))).convert('RGBA')
          foreground = Image.open(BytesIO(base64.b64decode(''))).convert('RGBA')
          for density, size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              folder = root / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = launcher.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', optimize=True)
              fg = foreground.resize((size*2+12,size*2+12), Image.Resampling.LANCZOS)
              fg.save(folder / 'ic_launcher_foreground.png', optimize=True)
          adaptive = root / 'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>'''
          (adaptive / 'ic_launcher.xml').write_text(xml)
          (adaptive / 'ic_launcher_round.xml').write_text(xml)
          values = root / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'ic_launcher_background.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#F3F7FB</color></resources>''')
          print('App icons generated successfully')
          PY
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Create Alarm Sound
        run: |
          python3 - <<'PY'
          import wave, struct, math, os
          sr = 16000
          def tone(f, d, a=0.6):
              n = int(sr * d)
              out = []
              for i in range(n):
                  env = min(1, i / 200, (n - i) / 200)
                  s = math.sin(2 * math.pi * f * i / sr)
                  sq = 1 if s > 0 else -1
                  out.append(int(a * env * 32767 * (0.5 * sq + 0.5 * s)))
              return out
          def sil(d):
              return [0] * int(sr * d)
          seq = []
          for _ in range(3):
              for f in (880, 1175, 880, 1175):
                  seq += tone(f, 0.22) + sil(0.08)
              seq += sil(0.5)
          os.makedirs("android/app/src/main/res/raw", exist_ok=True)
          with wave.open("android/app/src/main/res/raw/alarm.wav", "wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(sr)
              w.writeframes(b"".join(struct.pack("<h", max(-32768, min(32767, x))) for x in seq))
          PY
          ls -l android/app/src/main/res/raw/alarm.wav

      - name: Configure Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          for permission in [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK"
          ]:
              if permission not in s:
                  tag = f'<uses-permission android:name="{permission}"/>'
                  s = s.replace("<application", tag + "\n    <application", 1)
          if "android.speech.RecognitionService" not in s:
              q = '<queries>\n        <intent><action android:name="android.speech.RecognitionService"/></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n    </queries>'
              s = s.replace("<application", q + "\n    <application", 1)
          p.write_text(s)
          PY

      - name: Build IELTS Master APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK was not generated"; exit 1; }
          ls -lh "$APK"

      - name: Upload IELTS Master APK
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Master-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
