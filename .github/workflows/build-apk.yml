      - name: Apply App Icon (new logo)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          root = Path('android/app/src/main/res')
          launcher = Image.open(BytesIO(base64.b64decode(''))).convert('RGBA')
          foreground = Image.open(BytesIO(base64.b64decode(''))).convert('RGBA')
          for density, size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              folder = root / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = launcher.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', optimize=True)
              fg = foreground.resize((size*2+12,size*2+12), Image.Resampling.LANCZOS)
              fg.save(folder / 'ic_launcher_foreground.png', optimize=True)
          adaptive = root / 'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>'''
          (adaptive / 'ic_launcher.xml').write_text(xml)
          (adaptive / 'ic_launcher_round.xml').write_text(xml)
          values = root / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'ic_launcher_background.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#F3F7FB</color></resources>''')
          print('App icons generated successfully')
          PY
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Create Alarm Sound
        run: |
          python3 - <<'PY'
          import wave, struct, math, os
          sr = 16000
          def tone(f, d, a=0.6):
              n = int(sr * d)
              out = []
              for i in range(n):
                  env = min(1, i / 200, (n - i) / 200)
                  s = math.sin(2 * math.pi * f * i / sr)
                  sq = 1 if s > 0 else -1
                  out.append(int(a * env * 32767 * (0.5 * sq + 0.5 * s)))
              return out
          def sil(d):
              return [0] * int(sr * d)
          seq = []
          for _ in range(3):
              for f in (880, 1175, 880, 1175):
                  seq += tone(f, 0.22) + sil(0.08)
              seq += sil(0.5)
          os.makedirs("android/app/src/main/res/raw", exist_ok=True)
          with wave.open("android/app/src/main/res/raw/alarm.wav", "wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(sr)
              w.writeframes(b"".join(struct.pack("<h", max(-32768, min(32767, x))) for x in seq))
          PY
          ls -l android/app/src/main/res/raw/alarm.wav

      - name: Configure Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          for permission in [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK"
          ]:
              if permission not in s:
                  tag = f'<uses-permission android:name="{permission}"/>'
                  s = s.replace("<application", tag + "\n    <application", 1)
          if "android.speech.RecognitionService" not in s:
              q = '<queries>\n        <intent><action android:name="android.speech.RecognitionService"/></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n    </queries>'
              s = s.replace("<application", q + "\n    <application", 1)
          p.write_text(s)
          PY

      - name: Build IELTS Master APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK was not generated"; exit 1; }
          ls -lh "$APK"

      - name: Upload IELTS Master APK
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Master-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
