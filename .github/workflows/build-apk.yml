          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          src = Path('/tmp/wordhelper/app/src/main')
          dst = Path('android/app/src/main')
          java_dst = dst / 'java/com/ielts/master/skp'
          java_dst.mkdir(parents=True, exist_ok=True)
          for p in (src / 'java/com/bnword/helper').glob('*.java'):
              text = p.read_text(encoding='utf-8')
              text = text.replace('package com.bnword.helper;', 'package com.ielts.master.skp;')
              text = text.replace('MainActivity.class', 'com.ielts.master.skp.MainActivity.class')
              # Enable the helper by default once the user enables the Android accessibility service.
              text = text.replace('getBoolean(KEY_ON, false)', 'getBoolean(KEY_ON, true)')
              (java_dst / p.name).write_text(text, encoding='utf-8')
          for rel in ['xml/accessibility_config.xml', 'drawable/ic_close.xml', 'drawable/ic_mic.xml', 'drawable/ic_tile.xml']:
              target = dst / 'res' / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes((src / 'res' / rel).read_bytes())
          assets = dst / 'assets'
          assets.mkdir(parents=True, exist_ok=True)
          for name in ['pron.tsv', 'vocab.tsv']:
              (assets / name).write_bytes((src / 'assets' / name).read_bytes())

          # Merge the helper's strings without replacing Capacitor's existing app_name.
          strings_path = dst / 'res/values/strings.xml'
          tree = ET.parse(strings_path)
          root = tree.getroot()
          existing = {el.attrib.get('name') for el in root.findall('string')}
          for name, value in [
              ('tile_label', 'Word Helper'),
              ('a11y_desc', 'যেকোনো অ্যাপে ইংরেজি শব্দ নির্বাচন করলে নির্বাচিত শব্দের উচ্চারণ ও বাংলা অর্থ দেখায়।'),
          ]:
              if name not in existing:
                  el = ET.SubElement(root, 'string', {'name': name})
                  el.text = value
          tree.write(strings_path, encoding='utf-8', xml_declaration=True)

          # Register the selection-processing activity, accessibility service and quick-settings tile.
          manifest = dst / 'AndroidManifest.xml'
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          def has_component(tag, name):
              return any(e.tag == tag and e.attrib.get(ns+'name') == name for e in app)
          if not has_component('activity', '.ProcessTextActivity'):
              a = ET.SubElement(app, 'activity', {
                  ns+'name': '.ProcessTextActivity', ns+'exported': 'true',
                  ns+'label': 'Word Helper (উচ্চারণ ও অর্থ)',
                  ns+'theme': '@android:style/Theme.Translucent.NoTitleBar',
                  ns+'excludeFromRecents': 'true', ns+'taskAffinity': ''
              })
              f = ET.SubElement(a, 'intent-filter')
              ET.SubElement(f, 'action', {ns+'name':'android.intent.action.PROCESS_TEXT'})
              ET.SubElement(f, 'category', {ns+'name':'android.intent.category.DEFAULT'})
              ET.SubElement(f, 'data', {ns+'mimeType':'text/plain'})
          if not has_component('service', '.WordAccessibilityService'):
              s = ET.SubElement(app, 'service', {
                  ns+'name': '.WordAccessibilityService', ns+'exported':'true',
                  ns+'label':'@string/app_name',
                  ns+'permission':'android.permission.BIND_ACCESSIBILITY_SERVICE'
              })
              f = ET.SubElement(s, 'intent-filter')
              ET.SubElement(f, 'action', {ns+'name':'android.accessibilityservice.AccessibilityService'})
              ET.SubElement(s, 'meta-data', {
                  ns+'name':'android.accessibilityservice', ns+'resource':'@xml/accessibility_config'
              })
          if not has_component('service', '.ToggleTileService'):
              s = ET.SubElement(app, 'service', {
                  ns+'name':'.ToggleTileService', ns+'exported':'true',
                  ns+'icon':'@drawable/ic_tile', ns+'label':'@string/tile_label',
                  ns+'permission':'android.permission.BIND_QUICK_SETTINGS_TILE'
              })
              f = ET.SubElement(s, 'intent-filter')
              ET.SubElement(f, 'action', {ns+'name':'android.service.quicksettings.action.QS_TILE'})
          # Text-to-speech service discovery for Android.
          queries = root.find('queries')
          if queries is None:
              queries = ET.Element('queries')
              root.insert(list(root).index(app), queries)
          if not any(e.find('action') is not None and e.find('action').attrib.get(ns+'name') == 'android.intent.action.TTS_SERVICE' for e in queries.findall('intent')):
              intent = ET.SubElement(queries, 'intent')
              ET.SubElement(intent, 'action', {ns+'name':'android.intent.action.TTS_SERVICE'})
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY

      - name: Fix Gradle Download Timeout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          lines = p.read_text().splitlines()
          out = []
          found = False
          for line in lines:
              if line.startswith("distributionUrl="):
                  line = line.replace("-all.zip", "-bin.zip")
                  found = True
              if line.startswith("networkTimeout="):
                  continue
              out.append(line)
          if not found:
              raise SystemExit("Gradle distributionUrl missing")
          out.append("networkTimeout=120000")
          p.write_text("\n".join(out) + "\n")
          PY

