name: Build IELTS Master APK

# Everything needed for the APK (voice, microphone, icon, alarm sound) is created
# by this one file. The repository only needs: index.html + this workflow.

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_ROOT" || { echo "Android SDK not found"; exit 1; }
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor, Native Voice and Native Microphone
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/app@6.0.2 @capacitor/local-notifications@6.1.1 @capacitor-community/text-to-speech@4.0.2 @capacitor-community/speech-recognition@6.0.1 esbuild

      - name: Create Native Bridge (voice and microphone)
        run: |
          cat > tts-bridge.js <<'BRIDGE_EOF'
          import { TextToSpeech } from '@capacitor-community/text-to-speech';
          import { SpeechRecognition } from '@capacitor-community/speech-recognition';

          // ---- Native voice (Android Text-to-Speech) ----
          let tok = 0;
          window.IELTSNativeTTS = {
            speak: async (o) => {
              const id = ++tok;
              const base = { text: o.text, rate: o.rate ?? 0.95, pitch: o.pitch ?? 1, volume: o.volume ?? 1 };
              const langs = [o.lang || 'en-GB', 'en-US', null];
              let err;
              for (const l of langs) {
                if (id !== tok) return;
                try {
                  await TextToSpeech.speak(l ? Object.assign({ lang: l }, base) : base);
                  return;
                } catch (e) {
                  if (id !== tok) return;
                  err = e;
                }
              }
              throw err;
            },
            stop: async () => {
              tok++;
              try { await TextToSpeech.stop(); } catch (e) {}
            }
          };

          // ---- Native speech recognition (microphone -> text) ----
          let handles = [];
          const clean = async () => {
            for (const h of handles) { try { await h.remove(); } catch (e) {} }
            handles = [];
          };
          window.IELTSNativeSR = {
            ensure: async () => {
              try {
                const a = await SpeechRecognition.available();
                if (!a.available) return 'unavailable';
              } catch (e) { return 'unavailable'; }
              try {
                let p = await SpeechRecognition.checkPermissions();
                if (p.speechRecognition !== 'granted') p = await SpeechRecognition.requestPermissions();
                return p.speechRecognition === 'granted' ? 'ok' : 'denied';
              } catch (e) { return 'denied'; }
            },
            start: async (lang, onPartial, onState) => {
              try { await SpeechRecognition.stop(); } catch (e) {}
              await clean();
              handles.push(await SpeechRecognition.addListener('partialResults', (d) => {
                try { onPartial((d.matches && d.matches[0]) || ''); } catch (e) {}
              }));
              handles.push(await SpeechRecognition.addListener('listeningState', (d) => {
                try { onState(d.status); } catch (e) {}
              }));
              await new Promise((r) => setTimeout(r, 120));
              await SpeechRecognition.start({ language: lang || 'en-GB', maxResults: 1, partialResults: true, popup: false });
            },
            stop: async () => {
              try { await SpeechRecognition.stop(); } catch (e) {}
              await clean();
            }
          };
          BRIDGE_EOF

      - name: Prepare App and Bridge
        run: |
          test -f index.html || { echo "index.html missing from repository root"; exit 1; }
          mkdir -p www
          cp index.html www/index.html
          npx esbuild tts-bridge.js --bundle --format=iife --target=es2020 --outfile=www/tts-bridge.js

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ielts.master.skp",
            "appName": "IELTS Master",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": true }
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

