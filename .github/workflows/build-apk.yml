name: Build IELTS Master APK

on:
  workflow_dispatch:   # GitHub-এ গিয়ে ম্যানুয়ালি Run করা যাবে
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.*'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor project
        run: |
          # নতুন Capacitor প্রজেক্ট
          npm create @capacitor/app@latest . -- --name "IELTS Master" --app-id "com.ielts.master.skp" --template blank || true

          # package.json না থাকলে বানিয়ে দাও
          if [ ! -f package.json ]; then
            cat > package.json << 'EOF'
          {
            "name": "ielts-master",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo skip"
            },
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/app": "^6.0.2",
              "@capacitor/core": "^6.2.0",
              "@capacitor/local-notifications": "^6.1.1",
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF
          fi

          npm install
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 @capacitor/app@^6 @capacitor/local-notifications@^6 --save

      - name: Prepare web assets
        run: |
          mkdir -p www
          # রুটে index.html থাকলে কপি করো
          if [ -f index.html ]; then
            cp index.html www/index.html
          elif [ -f www/index.html ]; then
            echo "www/index.html already exists"
          else
            echo "ERROR: index.html not found in repo root or www/"
            exit 1
          fi
          # খালি favicon যাতে 404 না আসে
          touch www/favicon.ico || true

      - name: Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ielts.master.skp",
            "appName": "IELTS Master",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            },
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon_config_sample",
                "iconColor": "#0d3552",
                "sound": "beep.wav"
              }
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix Android permissions (Microphone + Notifications)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # RECORD_AUDIO না থাকলে যোগ করো
            if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
              sed -i 's|</manifest>|    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>|' "$MANIFEST"
            fi
            echo "=== AndroidManifest permissions ==="
            grep "uses-permission" "$MANIFEST" || true
          else
            echo "WARNING: AndroidManifest.xml not found"
            ls -la android/app/src/main/ || true
          fi

      - name: Enable WebView microphone / media permissions
        run: |
          # MainActivity-তে permission request হ্যান্ডেল করার জন্য প্রয়োজন হলে
          MAIN=$(find android -name "MainActivity.java" -o -name "MainActivity.kt" | head -1)
          echo "MainActivity: $MAIN"
          # Capacitor 6 সাধারণত নিজেই handle করে; extra কিছু লাগলে এখানে যোগ করা যাবে

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Master-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show APK info
        run: |
          find android -name "*.apk" -exec ls -lh {} \;
